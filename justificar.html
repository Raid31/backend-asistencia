<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Licencia Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    /* 1. TIPOGRAFÍA Y FONDO GLOBAL */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #ede9fe 100%);
        min-height: 100vh;
    }

    /* 2. BARRA DE NAVEGACIÓN SUPERIOR */
    .navbar {
        background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%) !important;
        padding: 14px 0 !important;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
    }
    .navbar .container, .navbar .container-fluid {
        background: transparent !important;
        box-shadow: none !important;
        padding-top: 0 !important; padding-bottom: 0 !important;
        margin-top: 0 !important; margin-bottom: 0 !important;
    }
    .navbar .navbar-brand, .navbar span { color: #ffffff !important; font-weight: 600; }
    .navbar .btn {
        background: rgba(255, 255, 255, 0.18) !important;
        border: 1px solid rgba(255, 255, 255, 0.35) !important;
        color: #ffffff !important;
        border-radius: 10px;
    }
    .navbar .btn:hover { background: rgba(255, 255, 255, 0.3) !important; }

    /* 3. TARJETAS FLOTANTES (Login, Justificaciones, QR) */
    .card {
        background: rgba(255, 255, 255, 0.95) !important;
        border-radius: 24px !important;
        border: none !important;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08) !important;
        backdrop-filter: blur(10px);
    }

    /* Contenedor principal de Admin (cuando no usa .card) */
    body > .container:not(:has(.card)) {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08);
        margin-top: 40px;
        margin-bottom: 40px;
    }

    h2, h3, h4, h5 { color: #312e81; font-weight: 700; margin-bottom: 20px; }

    /* 4. FORMULARIOS Y CAJAS DE TEXTO */
    .form-control {
        border-radius: 12px;
        padding: 12px 15px;
        border: 1px solid #c7d2fe;
        background-color: #f8fafc;
        color: #334155;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        background-color: #ffffff;
        box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.2);
        border-color: #818cf8;
    }
    .form-label { color: #4338ca; font-weight: 600; font-size: 0.95rem; }

    /* 5. BOTONES PRINCIPALES */
    .btn {
        border-radius: 12px; font-weight: 600; padding: 10px 20px;
        transition: all 0.3s ease; border: none !important;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25); }
    
    /* Botones primarios (Iniciar sesión, Subir licencia, Nuevo Trabajador) */
    .btn-primary, .btn-success, .btn-warning[type="submit"] {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
        color: #ffffff !important;
    }

    /* 6. TABLAS (Admin y Mi Historial) */
    .table { margin-top: 20px; }
    .table > thead > tr > th {
        background: #3730a3 !important; /* Índigo sólido */
        color: #ffffff !important; border: none; padding: 16px;
        font-weight: 500; letter-spacing: 0.5px;
    }
    .table > thead > tr > th:first-child { border-top-left-radius: 14px; border-bottom-left-radius: 14px; }
    .table > thead > tr > th:last-child { border-top-right-radius: 14px; border-bottom-right-radius: 14px; }
    .table > tbody > tr > td {
        vertical-align: middle; padding: 16px;
        border-bottom: 1px solid #e0e7ff; color: #334155;
    }

    /* 7. ETIQUETAS, ROLES Y ESTADOS */
    .badge, td span[class*="bg-"] {
        font-weight: 600 !important; padding: 6px 16px !important;
        border-radius: 30px !important; font-size: 0.85rem !important;
    }
    /* Lavanda (Trabajador, Asistencia OK) */
    .bg-success, .text-bg-success { background-color: #ede9fe !important; color: #6d28d9 !important; }
    /* Celeste (Administrador) */
    .bg-primary, .text-bg-primary { background-color: #e0e7ff !important; color: #3730a3 !important; }
    /* Amarillo pastel (Atraso) */
    .bg-warning, .text-bg-warning { background-color: #fef3c7 !important; color: #b45309 !important; }

    /* 8. BOTONES DE LA TABLA (Editar / Eliminar) */
    .btn-warning:not([type="submit"]) {
        background-color: #e0e7ff !important; color: #4338ca !important; padding: 7px 16px;
    }
    .btn-warning:not([type="submit"]):hover { background-color: #c7d2fe !important; color: #312e81 !important; }
    
    .btn-danger {
        background-color: #ffe4e6 !important; color: #be123c !important; padding: 7px 16px;
    }
    .btn-danger:hover { background-color: #fecdd3 !important; color: #9f1239 !important; }
</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Portal del Trabajador</a>
            <div class="d-flex align-items-center">
                <a href="qr.html" class="btn btn-outline-light btn-sm me-3">Volver a mi QR</a>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-body p-5">
                        <h3 class="text-secondary mb-4 fw-bold">🏥 Ingresar Justificación</h3>
                        
                        <form id="formJustificar" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Trabajador</label>
                                <input type="text" class="form-control bg-light" id="nombreVisual" readonly>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Motivo de la ausencia</label>
                                <input type="text" class="form-control" id="motivoJustificacion" placeholder="Ej: Licencia médica por resfriado" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de Inicio de Licencia</label>
                                    <input type="date" class="form-control" id="fechaInicio" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de Término</label>
                                    <input type="date" class="form-control" id="fechaFin" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Profesional Emisor (Doctor)</label>
                                <input type="text" class="form-control" id="profesionalEmisor" placeholder="Nombre del médico tratante" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Adjuntar Documento (Solo PDF)</label>
                                <input type="file" class="form-control" id="archivoPDF" accept="application/pdf" required>
                            </div>

                            <!-- Contenedor dinámico para los mensajes (oculto por defecto) -->
                            <div id="alertaMensaje" class="alert d-none text-center py-2 mb-3" role="alert"></div>

                            <button type="submit" class="btn btn-warning fw-bold w-100" id="btnEnviar">Enviar a Jefatura</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Verificamos sesión y llenamos el nombre
        const idWorker = localStorage.getItem('id_usuario');
        const nombreWorker = localStorage.getItem('nombre_usuario');

        if (!idWorker) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('nombreVisual').value = nombreWorker;
        }

        document.getElementById('formJustificar').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Desactivamos el botón temporalmente para que no envíen el PDF 2 veces por accidente
            const btnEnviar = document.getElementById('btnEnviar');
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Subiendo archivo...";

            const alerta = document.getElementById('alertaMensaje');
            // Limpiamos clases previas por si hay reintentos
            alerta.className = 'alert text-center py-2 mb-3 d-none'; 

            // Armamos el paquete con los datos separados tal como los pide la nueva base de datos
            const formData = new FormData();
            formData.append('idUsuario', idWorker);
            formData.append('motivo', document.getElementById('motivoJustificacion').value);
            formData.append('fechaInicio', document.getElementById('fechaInicio').value);
            formData.append('fechaFin', document.getElementById('fechaFin').value);       
            formData.append('profesionalEmisor', document.getElementById('profesionalEmisor').value);
            formData.append('archivo', document.getElementById('archivoPDF').files[0]);

            try {
                const respuesta = await fetch('https://backend-asistencia-9jjt.onrender.com/api/justificaciones', {
                    method: 'POST',
                    body: formData 
                });

                const datos = await respuesta.json();

                if (datos.success) {
                    // Mensaje de éxito verde
                    alerta.classList.add('alert-success');
                    alerta.innerText = '✅ ' + datos.mensaje;
                    alerta.classList.remove('d-none');
                    
                    // Esperamos 5 segundos para que el usuario lea el mensaje y lo devolvemos al inicio
                    setTimeout(() => {
                        window.location.href = 'qr.html';
                    }, 5000);

                } else {
                    // Mensaje de error rojo de la base de datos
                    alerta.classList.add('alert-danger');
                    alerta.innerText = '❌ Error: ' + datos.mensaje;
                    alerta.classList.remove('d-none');
                    btnEnviar.disabled = false;
                    btnEnviar.innerText = "Enviar a Jefatura";
                }
            } catch (error) {
                // Mensaje de error rojo de conexión
                alerta.classList.add('alert-danger');
                alerta.innerText = '❌ Ocurrió un error al enviar el documento.';
                alerta.classList.remove('d-none');
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Enviar a Jefatura";
            }
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
