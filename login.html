<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    /* 1. TIPOGRAFÍA Y FONDO GLOBAL */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #ede9fe 100%);
        min-height: 100vh;
    }

    /* 2. BARRA DE NAVEGACIÓN SUPERIOR */
    .navbar {
        background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%) !important;
        padding: 14px 0 !important;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
    }
    .navbar .container, .navbar .container-fluid {
        background: transparent !important;
        box-shadow: none !important;
        padding-top: 0 !important; padding-bottom: 0 !important;
        margin-top: 0 !important; margin-bottom: 0 !important;
    }
    .navbar .navbar-brand, .navbar span { color: #ffffff !important; font-weight: 600; }
    .navbar .btn {
        background: rgba(255, 255, 255, 0.18) !important;
        border: 1px solid rgba(255, 255, 255, 0.35) !important;
        color: #ffffff !important;
        border-radius: 10px;
    }
    .navbar .btn:hover { background: rgba(255, 255, 255, 0.3) !important; }

    /* 3. TARJETAS FLOTANTES (Login, Justificaciones, QR) */
    .card {
        background: rgba(255, 255, 255, 0.95) !important;
        border-radius: 24px !important;
        border: none !important;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08) !important;
        backdrop-filter: blur(10px);
    }

    /* Contenedor principal de Admin (cuando no usa .card) */
    body > .container:not(:has(.card)) {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08);
        margin-top: 40px;
        margin-bottom: 40px;
    }

    h2, h3, h4, h5 { color: #312e81; font-weight: 700; margin-bottom: 20px; }

    /* 4. FORMULARIOS Y CAJAS DE TEXTO */
    .form-control {
        border-radius: 12px;
        padding: 12px 15px;
        border: 1px solid #c7d2fe;
        background-color: #f8fafc;
        color: #334155;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        background-color: #ffffff;
        box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.2);
        border-color: #818cf8;
    }
    .form-label { color: #4338ca; font-weight: 600; font-size: 0.95rem; }

    /* 5. BOTONES PRINCIPALES */
    .btn {
        border-radius: 12px; font-weight: 600; padding: 10px 20px;
        transition: all 0.3s ease; border: none !important;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25); }
    
    /* Botones primarios (Iniciar sesión, Subir licencia, Nuevo Trabajador) */
    .btn-primary, .btn-success, .btn-warning[type="submit"] {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
        color: #ffffff !important;
    }

    /* 6. TABLAS (Admin y Mi Historial) */
    .table { margin-top: 20px; }
    .table > thead > tr > th {
        background: #3730a3 !important; /* Índigo sólido */
        color: #ffffff !important; border: none; padding: 16px;
        font-weight: 500; letter-spacing: 0.5px;
    }
    .table > thead > tr > th:first-child { border-top-left-radius: 14px; border-bottom-left-radius: 14px; }
    .table > thead > tr > th:last-child { border-top-right-radius: 14px; border-bottom-right-radius: 14px; }
    .table > tbody > tr > td {
        vertical-align: middle; padding: 16px;
        border-bottom: 1px solid #e0e7ff; color: #334155;
    }

    /* 7. ETIQUETAS, ROLES Y ESTADOS */
    .badge, td span[class*="bg-"] {
        font-weight: 600 !important; padding: 6px 16px !important;
        border-radius: 30px !important; font-size: 0.85rem !important;
    }
    /* Lavanda (Trabajador, Asistencia OK) */
    .bg-success, .text-bg-success { background-color: #ede9fe !important; color: #6d28d9 !important; }
    /* Celeste (Administrador) */
    .bg-primary, .text-bg-primary { background-color: #e0e7ff !important; color: #3730a3 !important; }
    /* Amarillo pastel (Atraso) */
    .bg-warning, .text-bg-warning { background-color: #fef3c7 !important; color: #b45309 !important; }

    /* 8. BOTONES DE LA TABLA (Editar / Eliminar) */
    .btn-warning:not([type="submit"]) {
        background-color: #e0e7ff !important; color: #4338ca !important; padding: 7px 16px;
    }
    .btn-warning:not([type="submit"]):hover { background-color: #c7d2fe !important; color: #312e81 !important; }
    
    .btn-danger {
        background-color: #ffe4e6 !important; color: #be123c !important; padding: 7px 16px;
    }
    .btn-danger:hover { background-color: #fecdd3 !important; color: #9f1239 !important; }
</style>
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body p-4">
                        <h4 class="text-center mb-4">Ingreso de Personal</h4>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" id="email" class="form-control" required placeholder="empleado@empresa.cl">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <!-- Contenedor visual del error (oculto por defecto) -->
                            <div id="alertaError" class="alert alert-danger d-none text-center py-2" role="alert">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        </form>
                    </div>  
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. Obtenemos lo que el usuario escribió
            const correo = document.getElementById('email').value;
            const contrasena = document.getElementById('password').value;
            
            // 2. Seleccionamos la alerta y la ocultamos al iniciar un nuevo intento
            const alerta = document.getElementById('alertaError');
            alerta.classList.add('d-none');

            try {
                // 3. Hacemos la llamada al backend
                const respuesta = await fetch('https://backend-asistencia-9jjt.onrender.com/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ correo: correo, contrasena: contrasena })
                });

                const datos = await respuesta.json();

                // 4. Verificamos la respuesta
                if (datos.success) {
                    // Guardamos todos los datos
                    localStorage.setItem('id_usuario', datos.usuario.idUsuario);
                    localStorage.setItem('codigoQR_usuario', datos.usuario.codigoQR);
                    localStorage.setItem('nombre_usuario', datos.usuario.nombre);
                    localStorage.setItem('rol_usuario', datos.usuario.idRol); 
                    
                    // Redirección inteligente
                    if (datos.usuario.idRol === 1) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'qr.html';
                    }
                } else {
                    // 5. Mostramos el error en la tarjeta en lugar de usar alert()
                    alerta.innerText = "❌ " + datos.mensaje;
                    alerta.classList.remove('d-none');
                }

            } catch (error) {
                // 6. Error de conexión con el servidor
                console.error('Error de conexión:', error);
                alerta.innerText = "❌ No se pudo conectar con el servidor.";
                alerta.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
