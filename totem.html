<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tótem de Asistencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librería para el escáner de cámara web -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-dark d-flex align-items-center vh-100">
    <div class="container text-center">
        <div class="card shadow-lg mx-auto" style="max-width: 500px; border-radius: 15px;">
            <div class="card-body p-5">
                <h3 class="mb-4 text-primary fw-bold">Recepción - Control de Acceso</h3>
                
                <!-- Contenedor de la cámara web -->
                <div class="mb-4 p-2 border rounded bg-light">
                    <div id="reader" style="width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden;"></div>
                </div>

                <!-- Pantalla de respuesta del Tótem -->
                <div id="mensajeTotem" class="alert d-none fs-5" role="alert"></div>
            </div>
        </div>
    </div>

    <script>
        // Función que se ejecuta cuando la cámara detecta un QR
        async function onScanSuccess(decodedText, decodedResult) {
            // Pausamos la cámara un momento para que no escanee el mismo código 10 veces por segundo
            html5QrcodeScanner.pause();
            
            const divMensaje = document.getElementById('mensajeTotem');
            divMensaje.className = 'alert mt-3 fs-5'; // Limpiamos estilos previos

            try {
                // Enviamos el código leído (ej: EMP-12345678) a tu backend
                const respuesta = await fetch('https://backend-asistencia-9jjt.onrender.com/api/marcar-asistencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigoQR: decodedText })
                });

                const datos = await respuesta.json();

                if (datos.success) {
                    // BIP exitoso
                    divMensaje.classList.add('alert-success');
                    divMensaje.innerHTML = `✅ <strong>¡Asistencia Registrada!</strong><br>${datos.mensaje} a las <strong>${datos.hora}</strong>`;
                } else {
                    // QR no reconocido
                    divMensaje.classList.add('alert-danger');
                    divMensaje.innerHTML = `❌ <strong>Acceso Denegado</strong><br>${datos.mensaje}`;
                }

                // Borramos el mensaje y reactivamos la cámara después de 4 segundos
                setTimeout(() => {
                    divMensaje.classList.add('d-none');
                    html5QrcodeScanner.resume();
                }, 4000);

            } catch (error) {
                divMensaje.classList.add('alert-danger');
                divMensaje.innerText = "Error de conexión con el servidor local.";
                
                setTimeout(() => {
                    divMensaje.classList.add('d-none');
                    html5QrcodeScanner.resume();
                }, 4000);
            }
        }

        // Ignoramos los errores visuales de lectura mientras la cámara intenta enfocar
        function onScanFailure(error) { }

        // Inicializamos la cámara web
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: {width: 250, height: 250} },
            false);
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
