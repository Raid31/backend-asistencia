<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Credencial Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    /* 1. TIPOGRAFÍA Y FONDO GLOBAL */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #ede9fe 100%);
        min-height: 100vh;
    }

    /* 2. BARRA DE NAVEGACIÓN SUPERIOR */
    .navbar {
        background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%) !important;
        padding: 14px 0 !important;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
    }
    .navbar .container, .navbar .container-fluid {
        background: transparent !important;
        box-shadow: none !important;
        padding-top: 0 !important; padding-bottom: 0 !important;
        margin-top: 0 !important; margin-bottom: 0 !important;
    }
    .navbar .navbar-brand, .navbar span { color: #ffffff !important; font-weight: 600; }
    .navbar .btn {
        background: rgba(255, 255, 255, 0.18) !important;
        border: 1px solid rgba(255, 255, 255, 0.35) !important;
        color: #ffffff !important;
        border-radius: 10px;
    }
    .navbar .btn:hover { background: rgba(255, 255, 255, 0.3) !important; }

    /* 3. TARJETAS FLOTANTES (Login, Justificaciones, QR) */
    .card {
        background: rgba(255, 255, 255, 0.95) !important;
        border-radius: 24px !important;
        border: none !important;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08) !important;
        backdrop-filter: blur(10px);
    }

    /* Contenedor principal de Admin (cuando no usa .card) */
    body > .container:not(:has(.card)) {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08);
        margin-top: 40px;
        margin-bottom: 40px;
    }

    h2, h3, h4, h5 { color: #312e81; font-weight: 700; margin-bottom: 20px; }

    /* 4. FORMULARIOS Y CAJAS DE TEXTO */
    .form-control {
        border-radius: 12px;
        padding: 12px 15px;
        border: 1px solid #c7d2fe;
        background-color: #f8fafc;
        color: #334155;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        background-color: #ffffff;
        box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.2);
        border-color: #818cf8;
    }
    .form-label { color: #4338ca; font-weight: 600; font-size: 0.95rem; }

    /* 5. BOTONES PRINCIPALES */
    .btn {
        border-radius: 12px; font-weight: 600; padding: 10px 20px;
        transition: all 0.3s ease; border: none !important;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25); }
    
    /* Botones primarios (Iniciar sesión, Subir licencia, Nuevo Trabajador) */
    .btn-primary, .btn-success, .btn-warning[type="submit"] {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
        color: #ffffff !important;
    }

    /* 6. TABLAS (Admin y Mi Historial) */
    .table { margin-top: 20px; }
    .table > thead > tr > th {
        background: #3730a3 !important; /* Índigo sólido */
        color: #ffffff !important; border: none; padding: 16px;
        font-weight: 500; letter-spacing: 0.5px;
    }
    .table > thead > tr > th:first-child { border-top-left-radius: 14px; border-bottom-left-radius: 14px; }
    .table > thead > tr > th:last-child { border-top-right-radius: 14px; border-bottom-right-radius: 14px; }
    .table > tbody > tr > td {
        vertical-align: middle; padding: 16px;
        border-bottom: 1px solid #e0e7ff; color: #334155;
    }

    /* 7. ETIQUETAS, ROLES Y ESTADOS */
    .badge, td span[class*="bg-"] {
        font-weight: 600 !important; padding: 6px 16px !important;
        border-radius: 30px !important; font-size: 0.85rem !important;
    }
    /* Lavanda (Trabajador, Asistencia OK) */
    .bg-success, .text-bg-success { background-color: #ede9fe !important; color: #6d28d9 !important; }
    /* Celeste (Administrador) */
    .bg-primary, .text-bg-primary { background-color: #e0e7ff !important; color: #3730a3 !important; }
    /* Amarillo pastel (Atraso) */
    .bg-warning, .text-bg-warning { background-color: #fef3c7 !important; color: #b45309 !important; }

    /* 8. BOTONES DE LA TABLA (Editar / Eliminar) */
    .btn-warning:not([type="submit"]) {
        background-color: #e0e7ff !important; color: #4338ca !important; padding: 7px 16px;
    }
    .btn-warning:not([type="submit"]):hover { background-color: #c7d2fe !important; color: #312e81 !important; }
    
    .btn-danger {
        background-color: #ffe4e6 !important; color: #be123c !important; padding: 7px 16px;
    }
    .btn-danger:hover { background-color: #fecdd3 !important; color: #9f1239 !important; }
</style>
</head>
<body class="bg-light">
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Portal del Trabajador</a>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <!-- Columna de la Credencial -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-body p-4 text-center">
                        <h4 class="text-secondary mb-1">Credencial de Acceso</h4>
                        <h2 class="fw-bold text-primary mb-4" id="nombrePantalla">Cargando...</h2>
                        
                        <div id="contenedorQR" class="d-flex justify-content-center mb-4 p-3 bg-white border rounded"></div>
                        
                        <p class="text-muted small mb-4">Acerca este código a la cámara de recepción para registrar tu entrada o salida.</p>
                        <hr>
                        <a href="justificar.html" class="btn btn-warning fw-bold w-100">
                            Subir Licencia Médica (PDF)
                        </a>
                    </div>
                </div>
            </div>

            <!-- Columna del Historial -->
            <div class="col-md-7 mb-4">
                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <h4 class="text-secondary mb-3 fw-bold">Mi Historial Reciente</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Entrada</th>
                                        <th>Salida</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaHistorial">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-3">Cargando historial...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const nombreWorker = localStorage.getItem('nombre_usuario');
        const qrWorker = localStorage.getItem('codigoQR_usuario');

        if (!nombreWorker || !qrWorker) {
            alert("Debes iniciar sesión primero.");
            window.location.href = 'login.html';
        } else {
            // Dibujar QR y Nombre
            document.getElementById('nombrePantalla').innerText = nombreWorker;
            new QRCode(document.getElementById("contenedorQR"), {
                text: qrWorker,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Cargar Historial
            cargarHistorial(qrWorker);
        }

        async function cargarHistorial(qr) {
            try {
                const respuesta = await fetch(`https://backend-asistencia-9jjt.onrender.com/api/mi-historial/${qr}`);
                const datos = await respuesta.json();
                const tbody = document.getElementById('tablaHistorial');
                tbody.innerHTML = '';

                if (datos.success && datos.historial.length > 0) {
                    datos.historial.forEach(reg => {
                        // Colorear el estado (Atrasado = rojo, OK = verde)
                        let badgeColor = 'bg-success';
                        if (reg.estadoAsistencia === 'ATRASADO') badgeColor = 'bg-danger';
                        if (reg.estadoAsistencia === 'SALIDA ANTICIPADA') badgeColor = 'bg-warning text-dark';

                        const fechaLimpia = reg.fecha.split('T')[0];
                        const horaSalida = reg.horaSalida ? reg.horaSalida : '--:--:--';

                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${fechaLimpia}</td>
                                <td>${reg.horaEntrada}</td>
                                <td>${horaSalida}</td>
                                <td><span class="badge ${badgeColor}">${reg.estadoAsistencia}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">No hay registros recientes.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('tablaHistorial').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-3">Error al cargar historial.</td></tr>`;
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
